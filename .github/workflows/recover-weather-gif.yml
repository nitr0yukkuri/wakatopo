name: Recover Weather GIF Update

on:
  workflow_run:
    workflows:
      - Update Live Weather GIF
    types:
      - completed

permissions: {}

jobs:
  retry-once:
    if: >-
      (
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out'
      ) &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Retry failed jobs once
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            core.notice(`Requested one retry for failed weather GIF run #${run.run_number}.`);

  report-persistent-failure:
    needs: retry-once
    if: >-
      always() &&
      (
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out'
      ) &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == 'main' &&
      (
        github.event.workflow_run.run_attempt >= 2 ||
        needs.retry-once.result == 'failure'
      )
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or reuse a failure issue
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const marker = `<!-- weather-gif-failure:${run.id} -->`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.body?.includes(marker));

            if (existing) {
              core.notice(`Failure issue #${existing.number} already tracks this run.`);
              return;
            }

            const retryFailed = run.run_attempt < 2;
            const title = `Weather GIF automation failed (run #${run.run_number})`;
            const body = [
              marker,
              'The scheduled or main-branch weather GIF update failed, and automatic recovery did not complete.',
              '',
              `- Run: ${run.html_url}`,
              `- Commit: \`${run.head_sha}\``,
              `- Attempt: ${run.run_attempt}`,
              retryFailed ? '- Automatic retry: the retry request itself failed.' : '- Automatic retry: exhausted; the second attempt failed.',
              '',
              'The last validated preview asset remains in place. Review the run logs, fix the underlying issue, then rerun the workflow.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
