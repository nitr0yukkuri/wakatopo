name: Generate Animated OGP

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/ogp/**'
      - 'src/app/layout.tsx'
      - 'src/app/card/**'
      - 'src/components/GlobalTransitionOverlay.tsx'
      - 'src/components/canvas/**'
      - 'src/components/dom/WeatherEffectsOverlay.tsx'
      - 'src/lib/worldVisualProfile.ts'
      - 'public/opengraph-image.gif'
  workflow_dispatch:

concurrency:
  group: generate-animated-ogp
  cancel-in-progress: true

jobs:
  generate-ogp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npx next start -p 3000 -H 127.0.0.1 > /tmp/living-planet-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ogp > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/living-planet-next.log
          exit 1

      - name: Record OGP scene
        run: node scripts/record_ogp.mjs

      - name: Convert OGP video to GIF
        run: |
          set -euo pipefail
          WEBM_FILE=$(find videos/ogp -type f -name '*.webm' | head -n 1)
          if [ -z "$WEBM_FILE" ]; then
            echo "No OGP WebM file was recorded."
            exit 1
          fi
          ffmpeg -y -i "$WEBM_FILE" -vf "fps=16,scale=1200:630:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128:stats_mode=diff[p];[s1][p]paletteuse=dither=sierra2_4a:diff_mode=rectangle" -loop 0 public/opengraph-image.gif
          rm -rf videos/ogp

      - name: Commit generated OGP when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- public/opengraph-image.gif; then
            echo 'Animated OGP is unchanged.'
            exit 0
          fi
          git add public/opengraph-image.gif
          git commit -m 'chore: regenerate animated Living Planet OGP [skip ci]'
          git push
