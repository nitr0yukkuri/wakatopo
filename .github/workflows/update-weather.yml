name: Update Live Weather GIF

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/update-weather.yml
      - scripts/test_update_weather_workflow.mjs
      - scripts/test_weather_asset_publisher.mjs
      - scripts/publish_weather_assets.sh
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  verify-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Check weather workflow safety
        run: npm run test:workflow

  update-gif:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: update-live-weather-gif
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run recording script
        run: npx --yes tsx scripts/record_weather.ts

      - name: Convert WebM to GIF
        run: |
          set -euo pipefail
          WEBM_FILE=$(find videos -type f -name '*.webm' | head -n 1)
          if [ -z "$WEBM_FILE" ]; then
            echo "No WebM file was recorded."
            exit 1
          fi
          ffmpeg -y -i "$WEBM_FILE" -ss 15 -t 5 -vf "setpts=1.25*PTS,fps=16,scale=800:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=256:stats_mode=diff[p];[s1][p]paletteuse=dither=sierra2_4a:diff_mode=rectangle" -loop 0 preview.gif
          rm -rf videos/

      - name: Publish GIF to asset branch
        shell: bash
        run: bash scripts/publish_weather_assets.sh preview.gif
      - name: Summary
        run: |
          echo "Live weather GIF published to preview-assets."
