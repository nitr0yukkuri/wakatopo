name: Update Live Weather GIF

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/update-weather.yml'
      - '.github/workflows/recover-weather-gif.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'public/**'
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a fresh recording even when the preview state is unchanged'
        required: false
        type: boolean
        default: false

concurrency:
  group: update-live-weather-gif
  cancel-in-progress: false

jobs:
  update-gif:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      skipped: ${{ steps.capture.outputs.skip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check workflow safety
        run: npm run test:workflow

      - name: Read previous weather preview state
        env:
          STATE_FILE: ${{ runner.temp }}/weather-preview-state.json
        run: |
          set -euo pipefail
          if git fetch --no-tags origin refs/heads/preview-assets:refs/remotes/origin/preview-assets; then
            if git cat-file -e origin/preview-assets:preview-state.json 2>/dev/null; then
              git show origin/preview-assets:preview-state.json > "$STATE_FILE"
            else
              echo 'No previous weather preview state found; the first run will record the GIF.'
            fi
          else
            echo 'Could not read the previous asset branch; treating this run as an initial capture.'
          fi

      - name: Record and validate weather GIF
        id: capture
        env:
          WEATHER_GIF_FORCE: ${{ github.event.inputs.force || 'false' }}
          WEATHER_PREVIOUS_STATE_FILE: ${{ runner.temp }}/weather-preview-state.json
          WEATHER_SOURCE_REVISION: ${{ github.sha }}
        run: node scripts/update_weather_gif.mjs

      - name: Commit GIF to assets branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.capture.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          ASSET_BRANCH='preview-assets'
          TMP_DIR="$(mktemp -d)"
          cp preview.gif "$TMP_DIR/preview.gif"
          cp preview-state.json "$TMP_DIR/preview-state.json"
          rm -f preview.gif preview-state.json

          git fetch origin "$ASSET_BRANCH"
          git switch --force-create "$ASSET_BRANCH" "origin/$ASSET_BRANCH"
          git rm -rf .
          cp "$TMP_DIR/preview.gif" preview.gif
          cp "$TMP_DIR/preview-state.json" preview-state.json
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Wakato Preview Assets</title>
            </head>
            <body>
              <img src="./preview.gif" alt="Live Weather Preview">
            </body>
          </html>
          HTML
          cat > package.json <<'JSON'
          {
            "private": true
          }
          JSON
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": null,
            "installCommand": "",
            "buildCommand": null,
            "outputDirectory": "."
          }
          JSON
          git add preview.gif preview-state.json index.html package.json vercel.json
          if git diff --cached --quiet; then
            echo 'Weather preview assets are byte-for-byte unchanged.'
            exit 0
          fi
          git commit -m 'chore: update live weather gif [skip ci]'
          git push origin "$ASSET_BRANCH"
