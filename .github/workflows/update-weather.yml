name: Update Live Weather GIF

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: update-live-weather-gif
  cancel-in-progress: true

jobs:
  update-gif:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run recording script
        run: npx --yes tsx scripts/record_weather.ts

      - name: Convert WebM to GIF
        run: |
          set -euo pipefail
          WEBM_FILE=$(find videos -type f -name '*.webm' | head -n 1)
          if [ -z "$WEBM_FILE" ]; then
            echo "No WebM file was recorded."
            exit 1
          fi
          ffmpeg -y -i "$WEBM_FILE" -ss 15 -t 5 -vf "setpts=1.25*PTS,fps=18,scale=720:-1:flags=lanczos,split[s0][s1];[s0]palettegen=stats_mode=diff[p];[s1][p]paletteuse=dither=sierra2_4a:diff_mode=rectangle" -loop 0 preview.gif
          rm -rf videos/

      - name: Commit GIF to assets branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          ASSET_BRANCH="preview-assets"
          TMP_DIR="$(mktemp -d)"
          cp preview.gif "$TMP_DIR/preview.gif"

          git fetch origin "$ASSET_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$ASSET_BRANCH"; then
            git switch --force-create "$ASSET_BRANCH" "origin/$ASSET_BRANCH"
          else
            git switch --orphan "$ASSET_BRANCH"
          fi

          git rm -rf . || true
          cp "$TMP_DIR/preview.gif" preview.gif
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Wakato Preview Assets</title>
            </head>
            <body>
              <img src="./preview.gif" alt="Live Weather Preview">
            </body>
          </html>
          HTML
          git add preview.gif
          git add index.html
          if git diff --cached --quiet; then
            echo "preview.gif is unchanged."
            exit 0
          fi
          git commit -m "chore: update live weather gif [skip ci]"
          git push origin "$ASSET_BRANCH"
